# Обновления зависимостей раз в неделю одним PR.
# cooldown: версия предлагается не раньше чем через 7 дней после публикации,
# как и min-release-age в .npmrc.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
